<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MicroI2I scientific workflow</title>
  <desc id="desc">End-to-end workflow from microscopy data through QA, training, inference, evaluation, registry and documentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#07122f"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial, Helvetica, sans-serif}
      .title{font-size:42px;font-weight:700;fill:#07122f}.subtitle{font-size:20px;fill:#40506f}
      .label{font-size:18px;font-weight:700;fill:#07122f}.body{font-size:14px;fill:#40506f}
      .card{rx:8;filter:url(#shadow);stroke-width:2}.lane{fill:#fbfdff;stroke-width:1.5;stroke-dasharray:5 5}
      .arrow{fill:none;stroke:#07122f;stroke-width:2.6;marker-end:url(#arrow)}
      .evidence{fill:none;stroke:#2563eb;stroke-width:2.4;stroke-dasharray:7 7;marker-end:url(#blueArrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" class="title">Scientific Workflow</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Every model result is tied to data QA, configs, manifests, metrics, and review artifacts</text>
  <rect x="510" y="118" width="180" height="5" rx="3" fill="#2563eb"/><rect x="600" y="118" width="90" height="5" rx="3" fill="#7c3aed"/>

  <rect x="58" y="158" width="1084" height="266" rx="18" class="lane" stroke="#2563eb"/>
  <text x="84" y="190" class="label" fill="#2563eb">Execution Path</text>
  <rect x="85" y="238" width="165" height="118" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="168" y="278" text-anchor="middle" class="label">Microscopy Data</text><text x="168" y="304" text-anchor="middle" class="body">paired, unpaired</text><text x="168" y="326" text-anchor="middle" class="body">EBSD, Kikuchi</text>
  <rect x="302" y="238" width="165" height="118" class="card" fill="#ecfeff" stroke="#0f9f9f"/>
  <text x="385" y="278" text-anchor="middle" class="label">Data QA</text><text x="385" y="304" text-anchor="middle" class="body">leakage, duplicates</text><text x="385" y="326" text-anchor="middle" class="body">contact sheets</text>
  <rect x="519" y="238" width="165" height="118" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="602" y="278" text-anchor="middle" class="label">Train / Infer</text><text x="602" y="304" text-anchor="middle" class="body">backend adapters</text><text x="602" y="326" text-anchor="middle" class="body">CPU/GPU policy</text>
  <rect x="736" y="238" width="165" height="118" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="819" y="278" text-anchor="middle" class="label">Evaluate</text><text x="819" y="304" text-anchor="middle" class="body">metrics, outliers</text><text x="819" y="326" text-anchor="middle" class="body">review panels</text>
  <rect x="953" y="238" width="165" height="118" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="1036" y="278" text-anchor="middle" class="label">Registry</text><text x="1036" y="304" text-anchor="middle" class="body">candidate/promote</text><text x="1036" y="326" text-anchor="middle" class="body">local overlays</text>
  <path class="arrow" d="M250 297 H302"/><path class="arrow" d="M467 297 H519"/><path class="arrow" d="M684 297 H736"/><path class="arrow" d="M901 297 H953"/>

  <rect x="58" y="478" width="1084" height="150" rx="18" class="lane" stroke="#7c3aed"/>
  <text x="84" y="510" class="label" fill="#7c3aed">Evidence Path</text>
  <rect x="130" y="540" width="230" height="62" class="card" fill="#f8fafc" stroke="#40506f"/>
  <text x="245" y="566" text-anchor="middle" class="label">Manifests</text><text x="245" y="588" text-anchor="middle" class="body">run, dataset, artifact</text>
  <rect x="485" y="540" width="230" height="62" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="566" text-anchor="middle" class="label">Teaching Docs</text><text x="600" y="588" text-anchor="middle" class="body">Sphinx, LaTeX, SVG</text>
  <rect x="840" y="540" width="230" height="62" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="955" y="566" text-anchor="middle" class="label">Scientific Claims</text><text x="955" y="588" text-anchor="middle" class="body">validated use + limits</text>
  <path class="evidence" d="M245 540 C310 430 420 370 385 356"/>
  <path class="evidence" d="M600 540 C610 440 620 390 602 356"/>
  <path class="evidence" d="M955 540 C930 430 870 370 819 356"/>
  <text x="600" y="675" text-anchor="middle" class="body">Solid arrows move workflow state; dashed arrows bind outputs to reproducibility evidence.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">MicroI2I roadmap status</title>
  <desc id="desc">Roadmap completion status with completed, active, and future phases.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#07122f"/></marker>
    <style>
      text{font-family:Arial, Helvetica, sans-serif}
      .title{font-size:42px;font-weight:700;fill:#07122f}.subtitle{font-size:20px;fill:#40506f}
      .label{font-size:17px;font-weight:700;fill:#07122f}.body{font-size:13px;fill:#40506f}
      .card{rx:8;filter:url(#shadow);stroke-width:2}.arrow{fill:none;stroke:#07122f;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" class="title">MicroI2I Roadmap Status</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Foundations are strong; next work hardens real execution and adds new scientific backends</text>
  <rect x="510" y="118" width="180" height="5" rx="3" fill="#2563eb"/><rect x="600" y="118" width="90" height="5" rx="3" fill="#7c3aed"/>

  <rect x="70" y="160" width="220" height="124" class="card" fill="#dcfce7" stroke="#16a34a"/>
  <text x="95" y="194" class="label">1. Governance</text><text x="95" y="220" class="body">AGENTS, quality gates</text><text x="95" y="244" class="body">docs/test/provenance rules</text><text x="95" y="268" class="label" fill="#166534">85% complete</text>
  <rect x="350" y="160" width="220" height="124" class="card" fill="#dcfce7" stroke="#16a34a"/>
  <text x="375" y="194" class="label">2. Dataset DataOps</text><text x="375" y="220" class="body">prepare, QA, leakage</text><text x="375" y="244" class="body">metadata + contact sheets</text><text x="375" y="268" class="label" fill="#166534">75% complete</text>
  <rect x="630" y="160" width="220" height="124" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="655" y="194" class="label">3. Training</text><text x="655" y="220" class="body">preflight, smoke, loss logs</text><text x="655" y="244" class="body">adapters + device policy</text><text x="655" y="268" class="label" fill="#92400e">65% complete</text>
  <rect x="910" y="160" width="220" height="124" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="935" y="194" class="label">4. Inference</text><text x="935" y="220" class="body">folder/single/manifest</text><text x="935" y="244" class="body">batch + reference review</text><text x="935" y="268" class="label" fill="#92400e">60% complete</text>

  <rect x="70" y="345" width="220" height="124" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="95" y="379" class="label">5. Evaluation</text><text x="95" y="405" class="body">metrics + outlier panels</text><text x="95" y="429" class="body">needs EBSD proxies</text><text x="95" y="453" class="label" fill="#92400e">55% complete</text>
  <rect x="350" y="345" width="220" height="124" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="375" y="379" class="label">6. Registry</text><text x="375" y="405" class="body">lifecycle + overlays</text><text x="375" y="429" class="body">needs promotion rules</text><text x="375" y="453" class="label" fill="#92400e">60% complete</text>
  <rect x="630" y="345" width="220" height="124" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="655" y="379" class="label">7. New Backends</text><text x="655" y="405" class="body">legacy adapters exist</text><text x="655" y="429" class="body">needs baseline/CUT/etc.</text><text x="655" y="453" class="label" fill="#1d4ed8">25% complete</text>
  <rect x="910" y="345" width="220" height="124" class="card" fill="#dcfce7" stroke="#16a34a"/>
  <text x="935" y="379" class="label">8. Teaching Docs</text><text x="935" y="405" class="body">Sphinx, formulas, SVG</text><text x="935" y="429" class="body">needs more tutorials</text><text x="935" y="453" class="label" fill="#166534">60% complete</text>

  <rect x="350" y="540" width="220" height="124" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="375" y="574" class="label">9. Automation</text><text x="375" y="600" class="body">check_repo + smoke gate</text><text x="375" y="624" class="body">needs CI workflow</text><text x="375" y="648" class="label" fill="#1d4ed8">45% complete</text>
  <rect x="630" y="540" width="300" height="124" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="655" y="574" class="label">Next Focus</text><text x="655" y="600" class="body">1. CPU smoke dependencies</text><text x="655" y="624" class="body">2. Promotion rules</text><text x="655" y="648" class="body">3. Baseline/CUT backend</text>
  <path class="arrow" d="M290 222 H350"/><path class="arrow" d="M570 222 H630"/><path class="arrow" d="M850 222 H910"/>
  <path class="arrow" d="M180 284 V345"/><path class="arrow" d="M460 284 V345"/><path class="arrow" d="M740 284 V345"/><path class="arrow" d="M1020 284 V345"/>
  <path class="arrow" d="M570 602 H630"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">pix2pix and CycleGAN architectures</title>
  <desc id="desc">Comparison of paired pix2pix and unpaired CycleGAN model architectures.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#bde0fe"/><stop offset="100%" stop-color="#176b87"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffd166"/><stop offset="100%" stop-color="#f2b84b"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#102a43"/><stop offset="100%" stop-color="#1b4965"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#102a43" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24566f"/></marker>
    <style>.box{rx:18;filter:url(#shadow)}.label{font:700 17px Segoe UI,Arial;fill:white}.dark{font:700 17px Segoe UI,Arial;fill:#102a43}.small{font:500 13px Segoe UI,Arial;fill:#234}.line{stroke:#24566f;stroke-width:3;fill:none;marker-end:url(#arrow)}.title{font:700 27px Segoe UI,Arial;fill:#102a43}</style>
  </defs>
  <rect width="1100" height="620" fill="#f7fbfd"/>
  <text x="45" y="50" class="title">Model Architectures</text>
  <text x="70" y="105" class="title">pix2pix: paired translation</text>
  <rect x="80" y="140" width="155" height="78" fill="url(#gold)" class="box"/><text x="118" y="175" class="dark">Input x</text><text x="104" y="198" class="small">source image</text>
  <rect x="305" y="140" width="175" height="78" fill="url(#blue)" class="box"/><text x="346" y="175" class="label">U-Net G</text><text x="335" y="198" class="label">with skips</text>
  <rect x="550" y="140" width="155" height="78" fill="url(#gold)" class="box"/><text x="584" y="175" class="dark">Output ŷ</text><text x="588" y="198" class="small">generated</text>
  <rect x="790" y="140" width="190" height="78" fill="url(#navy)" class="box"/><text x="823" y="175" class="label">PatchGAN D</text><text x="822" y="198" class="label">real/fake pair</text>
  <path class="line" d="M235 179 H305"/><path class="line" d="M480 179 H550"/><path class="line" d="M705 179 H790"/>
  <text x="70" y="315" class="title">CycleGAN: unpaired domain transfer</text>
  <rect x="80" y="360" width="140" height="70" fill="url(#gold)" class="box"/><text x="128" y="402" class="dark">A</text>
  <rect x="280" y="360" width="150" height="70" fill="url(#blue)" class="box"/><text x="326" y="392" class="label">G: A→B</text><text x="310" y="413" class="label">generator</text>
  <rect x="490" y="360" width="140" height="70" fill="url(#gold)" class="box"/><text x="535" y="402" class="dark">B̂</text>
  <rect x="710" y="360" width="150" height="70" fill="url(#blue)" class="box"/><text x="754" y="392" class="label">F: B→A</text><text x="742" y="413" class="label">cycle back</text>
  <rect x="920" y="360" width="140" height="70" fill="url(#gold)" class="box"/><text x="974" y="402" class="dark">Â</text>
  <path class="line" d="M220 395 H280"/><path class="line" d="M430 395 H490"/><path class="line" d="M630 395 H710"/><path class="line" d="M860 395 H920"/>
  <rect x="280" y="480" width="150" height="70" fill="url(#navy)" class="box"/><text x="315" y="512" class="label">D_B</text><text x="305" y="534" class="label">domain B</text>
  <rect x="710" y="480" width="150" height="70" fill="url(#navy)" class="box"/><text x="746" y="512" class="label">D_A</text><text x="735" y="534" class="label">domain A</text>
  <path class="line" d="M560 430 C560 500 430 515 430 515"/><path class="line" d="M990 430 C990 505 860 515 860 515"/>
</svg>

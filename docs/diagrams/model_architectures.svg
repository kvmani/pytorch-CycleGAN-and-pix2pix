<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MicroI2I model architectures</title>
  <desc id="desc">PyTex-style SVG comparing pix2pix paired translation and CycleGAN unpaired translation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#07122f" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#07122f"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial, Helvetica, sans-serif}
      .title{font-size:42px;font-weight:700;fill:#07122f}.subtitle{font-size:20px;fill:#40506f}
      .label{font-size:18px;font-weight:700;fill:#07122f}.body{font-size:14px;fill:#40506f}
      .card{rx:8;filter:url(#shadow);stroke-width:2}.lane{fill:#fbfdff;stroke-width:1.5;stroke-dasharray:5 5}
      .arrow{fill:none;stroke:#07122f;stroke-width:2.6;marker-end:url(#arrow)}
      .cycle{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-dasharray:7 7;marker-end:url(#blueArrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" class="title">Model Architectures</text>
  <text x="600" y="96" text-anchor="middle" class="subtitle">Paired pix2pix and unpaired CycleGAN as inspectable scientific workflows</text>
  <rect x="510" y="118" width="180" height="5" rx="3" fill="#2563eb"/><rect x="600" y="118" width="90" height="5" rx="3" fill="#7c3aed"/>

  <rect x="60" y="150" width="1080" height="205" rx="18" class="lane" stroke="#2563eb"/>
  <text x="90" y="184" class="label" fill="#2563eb">pix2pix: paired conditional translation</text>
  <rect x="105" y="220" width="155" height="86" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="182" y="254" text-anchor="middle" class="label">Input x</text><text x="182" y="280" text-anchor="middle" class="body">source image</text>
  <rect x="335" y="220" width="180" height="86" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="425" y="254" text-anchor="middle" class="label">U-Net G</text><text x="425" y="280" text-anchor="middle" class="body">skip-preserving generator</text>
  <rect x="590" y="220" width="155" height="86" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="667" y="254" text-anchor="middle" class="label">Output y_hat</text><text x="667" y="280" text-anchor="middle" class="body">translated image</text>
  <rect x="825" y="220" width="210" height="86" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="930" y="254" text-anchor="middle" class="label">PatchGAN D</text><text x="930" y="280" text-anchor="middle" class="body">real/fake local patches</text>
  <path class="arrow" d="M260 263 H335"/><path class="arrow" d="M515 263 H590"/><path class="arrow" d="M745 263 H825"/>

  <rect x="60" y="405" width="1080" height="230" rx="18" class="lane" stroke="#7c3aed"/>
  <text x="90" y="440" class="label" fill="#7c3aed">CycleGAN: unpaired domain transfer with cycle consistency</text>
  <rect x="100" y="485" width="120" height="76" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="160" y="529" text-anchor="middle" class="label">Domain A</text>
  <rect x="285" y="485" width="150" height="76" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="515" text-anchor="middle" class="label">G: A to B</text><text x="360" y="540" text-anchor="middle" class="body">generator</text>
  <rect x="500" y="485" width="120" height="76" class="card" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="560" y="529" text-anchor="middle" class="label">B_hat</text>
  <rect x="685" y="485" width="150" height="76" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="760" y="515" text-anchor="middle" class="label">F: B to A</text><text x="760" y="540" text-anchor="middle" class="body">cycle back</text>
  <rect x="900" y="485" width="120" height="76" class="card" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="960" y="529" text-anchor="middle" class="label">A_rec</text>
  <path class="arrow" d="M220 523 H285"/><path class="arrow" d="M435 523 H500"/><path class="arrow" d="M620 523 H685"/><path class="arrow" d="M835 523 H900"/>
  <rect x="285" y="590" width="150" height="58" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="360" y="625" text-anchor="middle" class="label">D_B</text>
  <rect x="685" y="590" width="150" height="58" class="card" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="760" y="625" text-anchor="middle" class="label">D_A</text>
  <path class="cycle" d="M560 561 C560 615 470 619 435 619"/><path class="cycle" d="M960 561 C960 615 870 619 835 619"/>
  <text x="600" y="684" text-anchor="middle" class="body">Dashed blue arrows mark adversarial domain checks; solid arrows mark image translation paths.</text>
</svg>

schema_version: microi2i.dataset_prepare_config.v1
output_root: artifacts/runs
dataset_id: unaligned_microscopy_default
task_type: unpaired_translation
source_roots:
  - ./datasets/domain_a
  - ./datasets/domain_b
split_policy:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42
preprocessing:
  image_size: 256
  color_mode: rgb
leakage_group_policy:
  mode: folder_or_specimen_id
  required: true

schema_version: microi2i.dataset_prepare_config.v1
output_root: artifacts/runs
dataset_id: paired_microscopy_default
task_type: paired_translation
source_roots:
  - ./datasets/source
output_dataset_dir: artifacts/prepared_datasets/paired_microscopy_default
split_policy:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42
preprocessing:
  color_mode: rgb
  resize: [256, 256]
  center_crop: null
  random_crop: null
  pad_to: null
  letterbox: null
  fill: 0
  paired_storage: concatenated_ab
leakage_group_policy:
  mode: folder_or_specimen_id
  regex: ""
  required: true

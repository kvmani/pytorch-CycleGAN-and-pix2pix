schema_version: microi2i.inference_config.v1
workflow: folder_inference
model_backend: legacy_pix2pix
output_root: artifacts/runs
dry_run: false
runtime:
  device: cpu
  gpu_ids: "-1"
  require_cuda: false
inference:
  legacy_script: test.py
  expected_output_dir: ./results/microscopy_inference/test_latest/images
  references_dir: ""
  inputs:
    mode: folder
    path: ./datasets/horse2zebra/testA
    recursive: false
    copy_to_run: true
  postprocess:
    grayscale: false
    resize: null
    threshold: null
    auto_contrast: false
    rename_prefix: ""
  legacy_args:
    - --dataroot
    - ./datasets/horse2zebra/testA
    - --name
    - microscopy_inference
    - --model
    - test
    - --no_dropout
    - --gpu_ids
    - "-1"
notes:
  purpose: Default migration-layer folder inference config. Replace dataroot/name/model options for real work.

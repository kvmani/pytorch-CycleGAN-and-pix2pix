schema_version: microi2i.inference_config.v1
workflow: single_image_inference
model_backend: legacy_pix2pix
output_root: artifacts/runs
dry_run: false
runtime:
  device: cpu
  gpu_ids: "-1"
  require_cuda: false
inference:
  legacy_script: test.py
  expected_output_dir: ./results/microscopy_single/test_latest/images
  inputs:
    mode: single
    path: ./datasets/single_image/example.png
    copy_to_run: true
  postprocess:
    grayscale: false
    resize: null
    threshold: null
    auto_contrast: false
    rename_prefix: ""
  legacy_args:
    - --dataroot
    - ./datasets/single_image
    - --name
    - microscopy_single
    - --model
    - test
    - --no_dropout
    - --gpu_ids
    - "-1"
notes:
  purpose: Single-image inference wrapper. Override inference.inputs.path and legacy dataroot for real work.

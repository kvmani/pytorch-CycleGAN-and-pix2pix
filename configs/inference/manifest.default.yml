schema_version: microi2i.inference_config.v1
workflow: manifest_inference
model_backend: legacy_pix2pix
output_root: artifacts/runs
dry_run: false
runtime:
  device: auto
  gpu_ids: "0"
  require_cuda: false
inference:
  legacy_script: test.py
  expected_output_dir: ./results/microscopy_manifest/test_latest/images
  references_dir: ""
  inputs:
    mode: manifest
    manifest_path: ./artifacts/inference_inputs_manifest.json
    copy_to_run: true
  postprocess:
    grayscale: false
    resize: null
    threshold: null
    auto_contrast: false
    rename_prefix: ""
  legacy_args:
    - --dataroot
    - ./datasets/manifest_inference
    - --name
    - microscopy_manifest
    - --model
    - test
    - --no_dropout
    - --gpu_ids
    - "0"
notes:
  purpose: Manifest-driven inference wrapper for curated image batches.

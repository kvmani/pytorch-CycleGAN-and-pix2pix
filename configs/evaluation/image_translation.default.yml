schema_version: microi2i.evaluation_config.v1
output_root: artifacts/runs
metrics:
  - mae
  - rmse
  - psnr
  - ssim
  - edge_preservation
  - ebsd_band_contrast
  - ebsd_band_sharpness
  - orientation_coherence
inputs:
  predictions_dir: ./artifacts/predictions
  targets_dir: ./artifacts/targets
review:
  ranking_metric: mae
  lower_is_better: true
  limit: 5
notes:
  purpose: Default scientific image translation evaluation config.

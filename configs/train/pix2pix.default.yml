schema_version: microi2i.train_config.v1
workflow: pix2pix_training
model_backend: legacy_pix2pix
output_root: artifacts/runs
dry_run: false
runtime:
  device: auto
  gpu_ids: "0"
  require_cuda: false
  seed: 42
training:
  legacy_script: train.py
  dataset_manifest_path: ""
  smoke:
    enabled: false
    max_epochs: 1
    max_dataset_size: 4
  validation_monitor:
    enabled: true
    fixed_images: []
    fixed_count: 5
    total_count: 5
    seed: 42
    eval_frequency_epochs: 1
    metrics:
      - mae
      - rmse
      - psnr
      - ssim
      - ebsd_band_contrast_delta
    export_html: true
  legacy_args:
    - --dataroot
    - ./datasets/facades
    - --name
    - microscopy_pix2pix
    - --model
    - pix2pix
    - --dataset_mode
    - aligned
    - --direction
    - BtoA
    - --gpu_ids
    - "0"
notes:
  purpose: Default migration-layer pix2pix training config. Replace dataroot/name for real work.

schema_version: microi2i.train_config.v1
workflow: pix2pix_smoke_training
model_backend: legacy_pix2pix
output_root: artifacts/runs
dry_run: false
runtime:
  device: cpu
  gpu_ids: "-1"
  require_cuda: false
  seed: 42
training:
  legacy_script: train.py
  dataset_manifest_path: artifacts/smoke_datasets/smoke_dataset_manifest.json
  smoke:
    enabled: true
    cpu_only: true
    max_epochs: 1
    max_dataset_size: 2
    image_size: 32
    disable_html: true
    checkpoints_dir: artifacts/smoke_checkpoints
  validation_monitor:
    enabled: true
    fixed_images: []
    fixed_count: 5
    total_count: 5
    seed: 42
    eval_frequency_epochs: 1
    metrics:
      - mae
      - rmse
      - psnr
      - ssim
      - ebsd_band_contrast_delta
    export_html: true
  legacy_args:
    - --dataroot
    - artifacts/smoke_datasets/pix2pix
    - --name
    - microi2i_pix2pix_smoke
    - --model
    - pix2pix
    - --dataset_mode
    - aligned
    - --direction
    - BtoA
    - --netG
    - resnet_6blocks
    - --gpu_ids
    - "-1"
notes:
  purpose: CPU-safe pix2pix smoke config. Run create-smoke-data first.

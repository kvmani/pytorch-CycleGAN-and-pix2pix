schema_version: microi2i.train_config.v1
workflow: pix2pix_smoke_training
output_root: artifacts/runs
dry_run: false
runtime:
  gpu_ids: "-1"
  seed: 42
training:
  legacy_script: train.py
  dataset_manifest_path: artifacts/smoke_datasets/smoke_dataset_manifest.json
  smoke:
    enabled: true
    cpu_only: true
    max_epochs: 1
    max_dataset_size: 2
    image_size: 32
    disable_html: true
    checkpoints_dir: artifacts/smoke_checkpoints
  legacy_args:
    - --dataroot
    - artifacts/smoke_datasets/pix2pix
    - --name
    - microi2i_pix2pix_smoke
    - --model
    - pix2pix
    - --dataset_mode
    - aligned
    - --direction
    - BtoA
    - --netG
    - unet_128
    - --gpu_ids
    - "-1"
notes:
  purpose: CPU-safe pix2pix smoke config. Run create-smoke-data first.
